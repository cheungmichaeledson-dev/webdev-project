<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get in touch with IntraSpots for inquiries, feedback, or collaboration opportunities in exploring Intramuros.">
  <title>IntraSpots | Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>

 <div id="header-placeholder"></div>
 <div id="sidebar-placeholder"></div>

  <!-- Overlay -->
  <label for="sidebarC" class="overlay" aria-hidden="true"></label>

  <!-- Main Content -->
  <main class="content" role="main">
      <section class="spot-section contact-intro">
      <h1>Contact Us</h1>
      <p>Have feedback, questions, or partnership ideas? Fill out the form below and our team will get back to you within 24 hours.</p>
    </section>

    <section class="spot-section contact-form-section">
      <form
  id="contactForm"
  class="contact-form"
  action="https://script.google.com/macros/s/AKfycbxInwK5aZI6iDclgY1CWF9zBlqu2wdmVO4egD2YvHhg1TnLSlpcGKFxaaU7vCH8pqA8lg/exec"
  method="POST"
  novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Name <span aria-hidden="true" class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="Your full name" required aria-required="true">
            <span class="error-message" id="nameError"></span>
          </div>
          <div class="form-group">
            <label for="email">Email <span aria-hidden="true" class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required aria-required="true">
            <span class="error-message" id="emailError"></span>
          </div>
          <div class="form-group full-width">
            <label for="subject">Subject <span aria-hidden="true" class="required">*</span></label>
            <input type="text" id="subject" name="subject" placeholder="Subject of your message" required>
            <span class="error-message" id="subjectError"></span>
          </div>
          <div class="form-group full-width">
            <label for="message">Message <span aria-hidden="true" class="required">*</span></label>
            <textarea id="message" name="message" rows="6" placeholder="Your message here..." required aria-required="true"></textarea>
            <span class="error-message" id="messageError"></span>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Send Message</button>
          <button type="reset" class="btn btn-secondary">Clear</button>
        </div>
        <div id="formSuccess" class="form-success" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 IntraSpots. All rights reserved.</p>
  </footer>

  <script src="barScript.js"></script>
  <script src="script.js"></script>
</body>
</html>
